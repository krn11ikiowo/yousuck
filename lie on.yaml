name: ken1key-mobileprovision-generator

on:
  workflow_dispatch:
    inputs:
      bundle_id:
        description: "Bundle ID for the app"
        required: true
        default: "com.kenen.ikiowk"
      team_id:
        description: "Team ID for code signing"
        required: true
        default: "KRNAPPLO"
      app_name:
        description: "App name"
        required: true
        default: "ken1key"
      p12_password:
        description: "Password for P12"
        required: true
        default: "ken1pass"

permissions:
  contents: write

jobs:
  generate-profile:
    runs-on: macos-15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          clean: false
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Verify OpenSSL
        run: |
          which openssl
          openssl version

      - name: Run ken1key profile generator
        run: |
          python3 ken1key_profile_generator.py \
            --bundle-id "${{ github.event.inputs.bundle_id }}" \
            --team-id "${{ github.event.inputs.team_id }}" \
            --name "${{ github.event.inputs.app_name }}" \
            --password "${{ github.event.inputs.p12_password }}"

      - name: List generated files
        run: |
          ls -R certs

      - name: Upload generated signing assets
        uses: actions/upload-artifact@v4
        with:
          name: ken1key-signing-assets
          path: certs
