name: ken1key-full-cert-pack

on:
  workflow_dispatch:
    inputs:
      ipa_path:
        description: "IPA to sign"
        required: true
        default: "Geode.ipa"

permissions:
  contents: write

jobs:
  generate-and-sign:
    runs-on: macos-15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Generate cert pack + mobileprovision
        run: |
          python3 ken1key_profile_generator.py \
            --team-id KRNAPPLO \
            --bundle-id com.kenen.ikiowk \
            --app-name ken1key \
            --crt certs/ken1key.crt \
            --p12 certs/ken1key.p12 \
            --p12-password "ken1pass" \
            --out certs/ken1key.mobileprovision

      - name: Sign IPA
        run: |
          python3 ken1key_ipa_signer.py \
            --ipa "${{ github.event.inputs.ipa_path }}" \
            --out signed.ipa \
            --p12 certs/ken1key.p12 \
            --p12-password "ken1pass" \
            --mobileprovision certs/ken1key.mobileprovision \
            --bundle-id "com.kenen.ikiowk" \
            --debug \
            --verbose

      - name: Upload signed IPA
        uses: actions/upload-artifact@v4
        with:
          name: signed-ipa
          path: signed.ipa

      - name: Upload full cert pack
        uses: actions/upload-artifact@v4
        with:
          name: ken1key-cert-pack
          path: |
            certs/ken1key.key
            certs/ken1key.crt
            certs/ken1key.p12
            certs/ken1key.mobileprovision
            certs/com.kenen.ikiowk.zsigncert
            certs/com.kenen.ikiowk.ksign
            certs/com.kenen.ikiowk.kenprov
            certs/ken1key.ken.pfx
            certs/com.kenen.ikiowk.esigncert
